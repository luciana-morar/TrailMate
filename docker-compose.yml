services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: trailmate-postgres
    environment:
      POSTGRES_DB: trailmate
      POSTGRES_USER: trailmate
      POSTGRES_PASSWORD: trailmate

    ports:
      - "5433:5432"
    volumes:
      - trailmate_pgdata:/var/lib/postgresql/data

volumes:
  trailmate_pgdata:

